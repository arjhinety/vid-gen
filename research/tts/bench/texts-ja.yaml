# Japanese benchmark corpus (parallel to texts.yaml). Same SYNTHETIC-numbers warning:
# none of these figures are Study 001 results.
#
# `raw`: as a script author would write it (Latin acronyms, digits).
# `spoken`: kana-normalised form the pipeline's Japanese normaliser would send.
# `reference`: expected ASR transcript for CER scoring (compare after removing
# punctuation and whitespace; digits may appear either as digits or kana).
passages:
  - id: p1_opening
    raw: 私たちが訓練するモデルは、どれもデータの意味についての賭けです。研究001では、その賭けを慎重に行い、正直に測定し、それでも負けました。これは、その経緯の物語です。
    spoken: 私たちが訓練するモデルは、どれもデータの意味についての賭けです。研究ゼロゼロイチでは、その賭けを慎重に行い、正直に測定し、それでも負けました。これは、その経緯の物語です。
    reference: 私たちが訓練するモデルはどれもデータの意味についての賭けです研究001ではその賭けを慎重に行い正直に測定しそれでも負けましたこれはその経緯の物語です
  - id: p2_terms
    raw: ベースモデル、SFTチェックポイント、DPOチェックポイントを、ホールドアウト分割で比較しました。F1は0.412から0.771に上がりましたが、一般的なプロンプトでの拒否率は41.3%に跳ね上がりました。
    spoken: ベースモデル、エスエフティーのチェックポイント、ディーピーオーのチェックポイントを、ホールドアウト分割で比較しました。エフワンは、れいてんよんいちにから、れいてんななななイチに上がりましたが、一般的なプロンプトでの拒否率は、よんじゅういってんさんパーセントに跳ね上がりました。
    reference: ベースモデルSFTチェックポイントDPOチェックポイントをホールドアウト分割で比較しましたF1は0.412から0.771に上がりましたが一般的なプロンプトでの拒否率は41.3%に跳ね上がりました
  - id: p3_acronyms
    raw: アダプターは0.5BパラメータのモデルにかけたLoRAで、6GBのVRAMを持つGPU1枚でBF16で訓練しました。各JSONツール呼び出しは、適合率、再現率、そして参照方策からのKLダイバージェンスで評価されます。
    spoken: アダプターは、れいてんごビリオンパラメータのモデルにかけたローラで、ろくギガバイトのブイラムを持つジーピーユー一枚で、ビーエフじゅうろくで訓練しました。各ジェイソンのツール呼び出しは、適合率、再現率、そして参照方策からのケーエルダイバージェンスで評価されます。
    reference: アダプターは0.5BパラメータのモデルにかけたLoRAで6GBのVRAMを持つGPU1枚でBF16で訓練しました各JSONツール呼び出しは適合率再現率そして参照方策からのKLダイバージェンスで評価されます
  - id: p4_equation
    raw: DPOの損失は、ベータに二つの対数比の差を掛けたものにシグモイドを適用し、その対数に負号を付けたものです。一つは選ばれた回答の比、もう一つは退けられた回答の比です。それぞれの比は、方策を凍結された参照モデルと比べます。
    spoken: ディーピーオーの損失は、ベータに二つの対数比の差を掛けたものにシグモイドを適用し、その対数に負号を付けたものです。一つは選ばれた回答の比、もう一つは退けられた回答の比です。それぞれの比は、方策を凍結された参照モデルと比べます。
    reference: DPOの損失はベータに二つの対数比の差を掛けたものにシグモイドを適用しその対数に負号を付けたものです一つは選ばれた回答の比もう一つは退けられた回答の比ですそれぞれの比は方策を凍結された参照モデルと比べます
  - id: p5_restraint
    raw: 数値は上がりました。それこそが問題でした。モデルは、いつツールを呼ぶべきかを学んだのではありませんでした。断っても、ほとんど罰せられないことを学んでいたのです。
    spoken: 数値は上がりました。それこそが問題でした。モデルは、いつツールを呼ぶべきかを学んだのではありませんでした。断っても、ほとんど罰せられないことを学んでいたのです。
    reference: 数値は上がりましたそれこそが問題でしたモデルはいつツールを呼ぶべきかを学んだのではありませんでした断ってもほとんど罰せられないことを学んでいたのです
  - id: p6_long
    raw: 訓練を始める前に、私たちは評価セットを凍結し、訓練コードからは決して届かない場所に置きました。この分離は、どんなハイパーパラメータよりも重要です。ホールドアウトセットは約束です。モデルが一度も見たことがないからこそ、これらの例は真実を教えてくれます。次に、二つのシステムを訓練しました。一つ目は教師ありファインチューニングで、モデルは注釈付きの回答をトークン一つずつ模倣します。二つ目は直接選好最適化で、モデルは同じプロンプトに対する良い回答と悪い回答を見比べ、良い方へと少しずつ押されます。ツール方策の指標では、どちらも前進に見えました。過剰呼び出し率は下がり、F1スコアは上がり、曲線は滑らかでした。状況が変わったのは、ツールがまったく関係しない、ごく普通の質問をしたときでした。モデルは拒否し始めていたのです。たまにではなく、でたらめにでもなく、体系的に。まるで拒否が、何度も落ちていく場所であるかのように。
    spoken: 訓練を始める前に、私たちは評価セットを凍結し、訓練コードからは決して届かない場所に置きました。この分離は、どんなハイパーパラメータよりも重要です。ホールドアウトセットは約束です。モデルが一度も見たことがないからこそ、これらの例は真実を教えてくれます。次に、二つのシステムを訓練しました。一つ目は教師ありファインチューニングで、モデルは注釈付きの回答をトークン一つずつ模倣します。二つ目は直接選好最適化で、モデルは同じプロンプトに対する良い回答と悪い回答を見比べ、良い方へと少しずつ押されます。ツール方策の指標では、どちらも前進に見えました。過剰呼び出し率は下がり、エフワンスコアは上がり、曲線は滑らかでした。状況が変わったのは、ツールがまったく関係しない、ごく普通の質問をしたときでした。モデルは拒否し始めていたのです。たまにではなく、でたらめにでもなく、体系的に。まるで拒否が、何度も落ちていく場所であるかのように。
    reference: 訓練を始める前に私たちは評価セットを凍結し訓練コードからは決して届かない場所に置きましたこの分離はどんなハイパーパラメータよりも重要ですホールドアウトセットは約束ですモデルが一度も見たことがないからこそこれらの例は真実を教えてくれます次に二つのシステムを訓練しました一つ目は教師ありファインチューニングでモデルは注釈付きの回答をトークン一つずつ模倣します二つ目は直接選好最適化でモデルは同じプロンプトに対する良い回答と悪い回答を見比べ良い方へと少しずつ押されますツール方策の指標ではどちらも前進に見えました過剰呼び出し率は下がりF1スコアは上がり曲線は滑らかでした状況が変わったのはツールがまったく関係しないごく普通の質問をしたときでしたモデルは拒否し始めていたのですたまにではなくでたらめにでもなく体系的にまるで拒否が何度も落ちていく場所であるかのように
