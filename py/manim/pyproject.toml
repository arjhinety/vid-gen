[project]
name = "ogmanim"
version = "0.1.0"
description = "Manim renderer for the research-video pipeline: OpenGrad theme, fonts, cue timing, easing."
requires-python = ">=3.12,<3.13"
dependencies = [
  "manim[typst]==0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ogmanim"]
