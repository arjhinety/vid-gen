# Kokoro-82M adapter environment (Apache-2.0 weights; preset voices, no cloning). English only here:
# misaki[ja] needs pyopenjtalk (sdist, MSVC build) + a 1 GB unidic download, and Kokoro's JA voices are C-grade.
[project]
name = "tts-kokoro"
version = "0.1.0"
description = "Kokoro-82M TTS adapter env"
requires-python = "==3.10.*"
dependencies = [
  "kokoro==0.9.4",
  "misaki[en]==0.9.4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "torch==2.10.0",
  "soundfile>=0.12",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
