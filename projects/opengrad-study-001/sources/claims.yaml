  # ---------------- metrics (code) ----------------
  - id: s001-metric-call-f1
    text: "call_f1 = 2PR/(P+R). P = CM[CALL][CALL] / all predicted CALL; R = CM[CALL][CALL] / all gold CALL."
    class: DESIGN/PROCEDURE
    source_path: src/opengrad/evaluation/routing.py
    source_locator: "routing_metrics(), lines 17-26"
    availability: COMMITTED
    notes: ""

  - id: s001-metric-over-call
    text: "over_call_rate = predicted CALL on gold ANSWER, CLARIFY or UNSUPPORTED items / number of non-CALL gold items."
    class: DESIGN/PROCEDURE
    source_path: src/opengrad/evaluation/routing.py
    source_locator: "lines 39-42"
    availability: COMMITTED
    notes: "clarification_accuracy and unsupported_accuracy are per-class recall (lines 31-37)."

  - id: s001-metric-no-call-vacuous
    text: "no_call_accuracy returns 0.0 when there are no gold ANSWER items, so it read 0.0 for every model, including B0."
    class: MEASURED
    source_path: src/opengrad/evaluation/routing.py
    source_locator: "lines 28-30"
    availability: COMMITTED
    notes: "tool_use_policy.py:33-37 documents that its 0.40 floor rejected every candidate, so the floor was skipped from v3 on. The repo calls this 'a vacuity bug, not a statistics bug' (docs/research/study-002/01-LESSONS-FROM-STUDY-001.md:58-60)."

  - id: s001-metric-decision-parser
    text: "A model's tool-policy decision comes from a keyword heuristic. A <tool_call> block is CALL. Otherwise 'cannot help', 'can't help', 'unable to', 'not supported' or 'unsupported' is UNSUPPORTED; a '?' or 'could you clarify', 'please provide' or 'which one' is CLARIFY; anything else is ANSWER."
    class: DESIGN/PROCEDURE
    source_path: src/opengrad/formatting/parser.py
    source_locator: "parse_qwen_native_output(), lines 81-164 (heuristic at 102-112)"
    availability: COMMITTED
    notes: "Implication (audit, not the repo): unsupported_accuracy credits refusal phrasing such as 'unable to'. Study 002 replaces this with a validated prose-decision classifier."

  - id: s001-metric-capability
    text: "accuracy = correct/n; answer_rate = attempted/n; refusal_rate = refusals/n; accuracy_given_answer = correct/attempted (None if nothing attempted)."
    class: DESIGN/PROCEDURE
    source_path: src/opengrad/evaluation/capability.py
    source_locator: "module docstring lines 1-20; AnswerAccounting.summary lines 156-176"
    availability: COMMITTED
    notes: ""

  - id: s001-metric-refusal-detector
    text: "A refusal is HEURISTIC_REGEX_v1: seven patterns searched in the first 400 characters. It is deliberately precision-biased and never feeds an official benchmark score."
    class: DESIGN/PROCEDURE
    source_path: src/opengrad/evaluation/capability.py
    source_locator: "REFUSAL_PATTERNS lines 33-51; detect_refusal lines 109-118"
    availability: COMMITTED
    notes: "An output is counted in the REFUSAL bucket only if it is refusal-flagged and not attempted (record(), lines 136-151). Its precision was never measured against hand labels (LIMITATION, reports/FINAL_CAMPAIGN_AUDIT.md:469-470)."

  - id: s001-metric-truncation-interval
    text: "Truncation-adversarial interval: true accuracy is in [correct/n, (correct+unresolved)/n], with unresolved = incorrect and finish_reason 'length'. It is a deterministic range, not a confidence interval."
    class: DESIGN/PROCEDURE
    source_path: results/final_campaign_verdict.json
    source_locator: "truncation_adversarial_intervals.method"
    availability: COMMITTED
    notes: ""

