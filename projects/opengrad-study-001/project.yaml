# OpenGrad Study 001 — pilot ("The empty bin"). ~5 minutes.
# The house sheet (research/reference-videos/experimental-labs/grammar.md) with explainer
# pacing and on-screen text (research/reference-videos/3b1b-nn-ch1/beats.md): no running
# caption; one open question at the top; terms written onto the exhibits; silent holds on
# the reveals. Why: research/audits/2026-09-29-pilot-audit.md. Sources: sources/.
# Data: data/study001.json (extracted from the OpenGrad repo by data/extract.py).
id: opengrad-study-001
title: "The empty bin"
description: >-
  OpenGrad Study 001 pilot: post-training a 2B model to decide when to call a tool,
  the refusal regression nobody's gate could see, and why Study 002 exists.
format: { width: 1920, height: 1080, fps: 30 }
brand: { name: Experimental Labs, place: Philippines, crumbs: [OpenGrad Study 001] }
# The narration is never shown as text: a word-by-word headline suits a 90 s trailer, not a
# five-minute explainer (audit §4).
headline: { enabled: false }
languages:
  en: { voice: narrator-en, subtitles: [en] }
  # Japanese voice with English subtitles burned in at the bottom (sentence-sized chunks
  # timed to the Japanese lines); sidecar SRT/VTT too.
  ja: { voice: narrator-ja, subtitles: [en], burn_subtitles: true }
script: script/narration.yaml
claims: sources/claims-pilot.yaml
audio:
  target_lufs: -16
  # Pauses are authored per line in the script; these are only the defaults between them.
  line_gap: 0.35
  beat_gap: 1.0
  # Two tracks generated by the owner with Google Flow music (paid plan; see
  # assets/music/PROVENANCE.md): the setup, then from the alarm to the end, cross-faded at the
  # cut. The bed sits 9 LU under the voice in the pauses and ducks 7 dB more under speech
  # (measured on the EN draft at -12/-6: 19 dB under the voice in speech, 16 dB in pauses).
  music:
    tracks:
      - { path: projects/opengrad-study-001/assets/music/graph-paper-learning.wav, from: cold-open }
      - { path: projects/opengrad-study-001/assets/music/hidden-flaw-discovery-take2.wav, from: smoke-test }
    gain_db: -9
    duck_db: -7
  # Sound marks the three reveals and the two verdicts only.
  sfx:
    - { at: "cold-open:bin", offset: 0.9, sound: impact, gain_db: -13 }
    - { at: "same-questions:refuse", offset: 0.4, sound: impact, gain_db: -12 }
    - { at: "empty-bin:empty", offset: 0.2, sound: impact, gain_db: -11 }
    - { at: "empty-bin:title", offset: 0.1, sound: stamp, gain_db: -16 }
    - { at: "what-next:nothing", offset: 0.1, sound: stamp, gain_db: -16 }
scenes:
  - id: cold-open
    renderer: web
    entry: scenes/ColdOpen.tsx
    section: [Qwen3.5-2B]
    # Silence first: the question types itself before anyone speaks.
    lead: 2.6
    hold: 2.6
    question: [{ at: better, text: "How did the model that refuses score better?" }]
    beats: [b01, b02]
    claims: [pilot-sentinel-base, pilot-sentinel-m1, pilot-m1-promoted]
  - id: four-moves
    renderer: web
    entry: scenes/FourMoves.tsx
    section: [§ The question]
    lead: 0.6
    hold: 1.2
    question: "Can training teach a small model when to use a tool?"
    beats: [b03, b04]
    claims: [pilot-question, pilot-model, pilot-four-modes, pilot-b0-overcall]
  - id: training
    renderer: web
    entry: scenes/Training.tsx
    section: [01 · Post-training]
    lead: 0.5
    hold: 0.6
    beats: [b05, b06]
    claims: [pilot-corpus, pilot-confirmatory-once, pilot-m0-overcall, pilot-dpo-method, pilot-dpo-gain, pilot-dpo-noise, pilot-gate-change]
  - id: f1-geometry
    renderer: manim
    entry: scenes/manim/f1_geometry.py:F1Geometry
    section: [01 · Post-training, The metric]
    lead: 0.7
    hold: 1.8
    question: "What does the score actually measure?"
    beats: [b07]
    claims: [pilot-metric-defs, pilot-b0-pr, pilot-m0-pr, pilot-dpo-gain]
  - id: smoke-test
    renderer: web
    entry: scenes/SmokeTest.tsx
    section: [02 · The alarm]
    lead: 0.6
    hold: 1.6
    question: "How did the model that refuses score better?"
    beats: [b08]
    claims: [pilot-sentinel-score]
  - id: same-questions
    renderer: web
    entry: scenes/SameQuestions.tsx
    section: [02 · The alarm, GSM8K + capability]
    lead: 0.7
    hold: 1.4
    question:
      - { text: "Is it refusing, or has it lost the skill?" }
      - { at: loss, text: null }
    beats: [b09, b10, b11]
    claims: [pilot-gsm8k-n, pilot-gsm8k-base, pilot-gsm8k-refuse, pilot-gsm8k-8shot, pilot-capability-loss, pilot-two-failures]
  - id: empty-bin
    renderer: web
    entry: scenes/EmptyBin.tsx
    section: [03 · The empty bin]
    lead: 0.8
    hold: 2.6
    question: [{ at: "line:b12#0", text: "Why didn't any gate catch it?" }]
    beats: [b12]
    claims: [pilot-heldout-counts, pilot-vacuity]
  - id: the-label
    renderer: web
    entry: scenes/TheLabel.tsx
    section: [04 · The label]
    lead: 0.6
    hold: 1.0
    question: "Where did the refusals come from?"
    beats: [b13]
    claims: [pilot-label-code, pilot-refusal-share, pilot-refusal-w2c, pilot-suspect]
  - id: basin
    renderer: manim
    entry: scenes/manim/basin.py:RefusalBasin
    section: [04 · The label, Not measured]
    lead: 0.7
    hold: 2.0
    beats: [b14]
    claims: [pilot-metaphor, pilot-gsm8k-8shot]
  - id: what-next
    renderer: web
    entry: scenes/WhatNext.tsx
    section: [05 · What next]
    lead: 0.6
    hold: 1.6
    question: "What would fix it?"
    beats: [b15, b16]
    claims: [pilot-label-not-refusal, pilot-limits, pilot-s002-explain, pilot-pconf, pilot-s002-gate, pilot-punans-stop]
  - id: close
    renderer: web
    entry: scenes/Close.tsx
    section: [Study 002]
    lead: 0.8
    hold: 5.0
    question: null
    beats: [b17]
    claims: [pilot-tagline]
