    source_locator: "2024-12-27 post"
  - id: oa-lp
    text: "In March 2019 OpenAI created OpenAI LP, a 'capped-profit' company controlled by the nonprofit's board, to raise capital for compute and talent; first-round returns 'capped at 100x their investment'."
    class: measured
