# Claims this film makes.
# Sources:
#   sources/governance-draft-v0.1.pdf — the founders' draft v0.1 (Sep 26, 2026; sha256 in data/governance.json).
#   sources/research-openai.md, sources/research-ph-law.md — web research (primary URLs quoted there); claims taken
#     from them name the primary URL as source_path.
#   owner instruction (2026-09-29) — facts the owner told us that are not in any document (Xynil's role).
# Classes, as used here:
#   design                 the draft's decisions and proposals (none adopted yet), or a plan stated by the owner.
#   author-interpretation  the draft's reading of Philippine law; or this film's own derivation from the draft's rules
#                          (e.g. two thirds of four members); or a summary of research that a lawyer should confirm.
#   limitation             a weakness or an open legal question the sources themselves flag.
#   measured               a documented, dated fact from a primary source (the OpenAI timeline).
claims:
  # ------------------------------------------------------------------ the decisions
  - id: founder-choices
    text: "The draft lists sixteen founder decisions; five block Articles drafting; the rest can be settled while the By-Laws and policies are drafted."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 opening, p.48"
  - id: founder-blocking
    text: "Items 1-5 of Founder Review Required block the Articles: purpose-clause approach, principal office address, initial capital and contributors, residency/citizenship confirmation, trustee expense reimbursement."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 items 1-5, pp.49"
  - id: d1-why
    text: "The BIR's organizational test looks for a Sec. 30 'scientific' purpose in the Articles; a purpose that is too narrow forces amendments, too broad invites BIR doubt."
    class: author-interpretation
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§1 p.3; GDR-009 consequences, p.7"
  - id: d1-rec
    text: "Recommendation: accept the purpose-clause approach (RMO 'scientific' wording + machine learning + open results). Alternatives: broader tech purpose; narrower ML-only wording."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 1, p.49"
  - id: d2
    text: "Principal office: a Philippine address you can keep for years; avoid a home address if another option exists. Alternatives: a founder's home; co-working or university address. It appears in public SEC records."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 2, p.49; GDR-034 p.10"
  - id: d3
    text: "Initial capital: a modest, equal contribution from each founder recommended; alternatives unequal amounts or one contributor; contributors are listed publicly; contribution gives no ownership."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 3, p.49"
  - id: d3-foundation
    text: "Avoid the word 'foundation' in the name, which triggers a PHP 1,000,000 minimum (marked 'verify')."
    class: author-interpretation
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§13 Articles outline, Eighth article, p.36"
  - id: d4
    text: "The Treasurer must be a Philippine resident and the Secretary a Philippine citizen and resident (RCC Sec. 24, as the draft reads it); founders to confirm John is resident and Arjhine a citizen and resident, else swap offices."
    class: author-interpretation
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "p.3; §17 item 4, p.49"
  - id: d5
    text: "Trustees may claim documented out-of-pocket expenses: true reimbursement only, approved by another trustee (recommended); alternative: no reimbursements in year one."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 5, p.49; §12 principle 10, p.33"
  - id: d5-risk
    text: "Flat per diems carry BIR risk; keep it to true reimbursement, not a flat allowance, to stay clear of the per diem issue."
    class: author-interpretation
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 5, p.49; §12 principle 10, p.33"
  - id: d6
    text: "'Experimental Intelligence': recommended as a research program or brand of Experimental Machines; a program needs no filing."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 6, p.50; GDR-008"
  - id: d16
    text: "Decide each existing asset case by case (transfer, license to EM, or keep external); start with domains, accounts and the Play Store listing. Most assets are already open-licensed; some benchmark repos have no licence file."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 16, p.51; §10 Register, pp.29-30"
  - id: d16-vq
    text: "Visual-Qwen began as an FEU Tech thesis with five authors; co-authors' and possibly FEU's rights must be checked first."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§10 Register, p.30"
  - id: d7
    text: "Mission change: 2/3 at two meetings at least 60 days apart (recommended), or unanimity while fewer than five members (gives one founder a veto)."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 7, p.50; §4 p.15"
  - id: d8
    text: "Commit to at least two non-founder members, or a five-seat Board, within 3 years (recommended), addressing founder entrenchment."
