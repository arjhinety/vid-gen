    source_locator: "2019-03-11 post"
  - id: oa-fired
    text: "On November 17, 2023 the OpenAI, Inc. board removed its CEO; it decided to rehire him on November 21, 2023 (four days later)."
    class: measured
    source_path: https://openai.com/index/review-completed-altman-brockman-to-continue-to-lead-openai/
    source_locator: "'the November 21 decision to rehire'; removal: openai.com/index/openai-announces-leadership-transition/"
  - id: oa-pbc-plan
    text: "In December 2024 OpenAI proposed turning its for-profit into a Delaware PBC that would 'run and control OpenAI's operations and business'."
