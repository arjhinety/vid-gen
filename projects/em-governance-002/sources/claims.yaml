    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 9, p.50; GDR-017 p.8"
  - id: d10
    text: "Officers elected by the Board (recommended) or directly by members."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 10, p.50"
  - id: d11
    text: "Member proxies: yes, in writing, for a single meeting (recommended)."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 11, p.50"
  - id: d13
    text: "Bank: two signatures above a set amount; President and Treasurer as signatories (recommended); the amount is open (GDR-030)."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 13, p.51"
  - id: extra-titles
    text: "What each founder is called on the research side is a FOUNDER DECISION; public sites show 'Founder' and 'Co-Founder' only."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§2, p.5"
  - id: extra-threshold
    text: "The threshold above which the Board approves expenditures, equipment and compute is a FOUNDER DECISION."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§5 table, p.16"
  - id: d14
    text: "Adopt the consulting bright line (recommended): no consulting, managed services, paid deployments or private paid benchmarking as an activity."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 14, p.51; GDR-027 p.32"
  - id: d15
    text: "Adopt 'no dealings with a founder-linked company until two disinterested trustees exist' (recommended); alternative: member ratification under RCC Sec. 31."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 15, p.51"
  - id: status-provisional
    text: "Twenty-four items are PROVISIONAL recommendations for the founders to accept, change or reject; nothing recommended was moved into DECIDED."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§3 p.6; §18 pp.51-52"
  - id: provisional-list
    text: "The PROVISIONAL items include purpose, member powers, mission protection, Board powers, research independence, admission, removal, terms, expansion, meetings, conflicts, compensation, the separate-company principle, IP, the asset register, sponsored research, consulting, finance, integrity, deadlock, Research Council, fiscal year, public statements and corporate term."
