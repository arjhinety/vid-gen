  # ------------------------------------------------------------------ the OpenAI move (research-openai.md; every row VERIFIED there)
  - id: oa-founding
    text: "OpenAI, Inc. was incorporated in Delaware on December 8, 2015 as a charitable nonstock corporation; at launch its funders 'have committed $1 billion'."
    class: measured
    source_path: https://openai.com/index/introducing-openai/
    source_locator: "launch post (2015-12-11); incorporation date from the Delaware AG amicus, Musk v. Altman ECF 77-1 p.3; see sources/research-openai.md"
  - id: oa-cash
    text: "By OpenAI's own account, cash donations over 2015-2019 were $137M (plus compute credits)."
    class: measured
