    source_path: https://openai.com/index/why-our-structure-must-evolve-to-advance-our-mission/
    source_locator: "2024-12-27 post"
  - id: oa-ag
    text: "The Delaware Attorney General began her review on October 9, 2024 and completed it on October 28, 2025 ('over a year'); California's investigation ran about a year and a half."
    class: measured
    source_path: https://news.delaware.gov/2025/10/28/ag-jennings-completes-review-of-openai-recapitalization/
    source_locator: "DE AG release; CA: oag.ca.gov press release 2025-10-28"
  - id: oa-reversal
