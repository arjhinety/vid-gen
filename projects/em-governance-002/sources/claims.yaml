    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§17 item 12, p.50; §7 p.22"
  - id: d9
    text: "Trustee terms: two-year staggered (recommended) or three-year; both within RCC Sec. 91's three-year cap."
