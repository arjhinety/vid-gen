    source_locator: "§17 item 8, p.50; §16 item 1, p.45"
  - id: d12
    text: "Agree now on one or two trusted outsiders as the standing independent reviewer (not a member, not paid by EM, e.g. a lawyer or senior academic); deciding in a dispute is much harder."
