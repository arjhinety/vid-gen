    class: measured
    source_path: https://openai.com/index/evolving-our-structure/
    source_locator: "2025-05-05 post"
  - id: oa-recap
    text: "Recapitalization completed October 28, 2025: the OpenAI Foundation holds about 26% (about $130B) of OpenAI Group PBC, Microsoft about 27%, employees and investors 47%; the Foundation appoints all PBC directors and 'can replace directors at any time'."
    class: measured
    source_path: https://openai.com/our-structure/
    source_locator: "our-structure page; Microsoft share: openai.com/index/next-chapter-of-microsoft-openai-partnership/"
  - id: oa-verdict
    text: "In Musk v. Altman, a unanimous advisory jury found on May 18, 2026 that the breach-of-charitable-trust and unjust-enrichment claims were barred by the statute of limitations; the judge adopted the verdict on May 20, 2026. Other claims and counterclaims remained on the docket."
    class: measured
    source_path: https://www.courtlistener.com/docket/69013420/572/musk-v-altman/
    source_locator: "ECF 572 (verdict form), ECF 580 (order)"
