  # ------------------------------------------------------------------ Philippine law (research-ph-law.md; research, not legal advice)
  - id: ph-no-conversion
    text: "The SEC's position: 'a non-stock corporation cannot be converted into a stock corporation by mere amendment of the articles of incorporation' (SEC-OGC Opinion 22-14, 2022, adopting 1995 and 1989 opinions). SEC-OGC opinions are not binding precedent but reflect consistent practice."
    class: author-interpretation
    source_path: https://www.sec.gov.ph/wp-content/uploads/2022/10/2022OpinionNo22-14_Legalityofconvertinganon-stock_non-profittoastockcorporation.pdf
    source_locator: "Opinion 22-14 (7 Oct 2022); research-ph-law.md Q1"
  - id: ph-dissolution
    text: "To become a stock company it must first dissolve and liquidate under the non-stock rules; members then may form a new stock corporation. Donor-restricted assets must go to similar organisations (RCC Sec. 93(c)); the draft's Articles dissolution clause (required for tax exemption, RMO 38-2019 IV.A.6/VI.A.2) sends all remaining assets to similar non-profits or the government, never to founders."
    class: author-interpretation
    source_path: https://www.sec.gov.ph/wp-content/uploads/2022/10/2022OpinionNo22-14_Legalityofconvertinganon-stock_non-profittoastockcorporation.pdf
    source_locator: "Opinion 22-14 (quoting 1989 Roxas opinion); research-ph-law.md Q6 and caveat 1; governance draft §13 Twelfth article"
  - id: ph-invest
    text: "A non-stock corporation may invest in another corporation or business (RCC Secs. 35(g), 41): outside the primary purpose this needs a trustee majority plus ratification by 2/3 of members; business activity must be 'incidental, necessary or essential' to its stated purpose (SEC-OGC 24-21, 24-33, 26-08). No SEC opinion squarely covers controlling a for-profit subsidiary."
    class: author-interpretation
    source_path: https://www.sec.gov.ph/wp-content/uploads/2024/10/2024Opinion-No-24-21-re-Non-Stock-Non-Profit-Org-to-Establish-Income-Generating-Activity-Contact-Call-Center.pdf
    source_locator: "research-ph-law.md Q2; RCC Sec. 41 (Supreme Court E-Library text)"
  - id: ph-tax
    text: "Income from for-profit activities of a Sec. 30 organisation is taxable (NIRC Sec. 30 last paragraph; CIR v. St. Luke's, 2012); if a 'substantial part' of operations becomes for-profit, the operational test fails (RMO 38-2019 III) and the exemption ruling is deemed revoked as of the date of the material change (RMO 38-2019 VII). How St. Luke's and the RMO fit together is an open question for counsel."
    class: author-interpretation
    source_path: https://www.pcnc.com.ph (BIR RMO 38-2019, PCNC-hosted copy)
    source_locator: "research-ph-law.md Q3, Q4; lawphil St. Luke's G.R. 195909"
  - id: ph-interlock
    text: "Under RCC Sec. 32, stockholdings over 20% are 'substantial' for interlocking directors; contracts between the two corporations then fall under Sec. 31 on the nonprofit side; with three conflicted trustees Sec. 31's quorum and vote conditions cannot be met."
    class: author-interpretation
    source_path: https://elibrary.judiciary.gov.ph (RA 11232 Secs. 31-32)
    source_locator: "research-ph-law.md Q5"
  - id: ph-ratify
    text: "Such a contract is voidable unless ratified by at least 2/3 of the members at a meeting called for the purpose, with full disclosure, and the contract is fair and reasonable (RCC Sec. 31)."
    class: author-interpretation
    source_path: https://elibrary.judiciary.gov.ph (RA 11232 Sec. 31)
    source_locator: "research-ph-law.md Q5, caveat 6"
  - id: ph-gift
    text: "Transferring assets or IP below fair value is a deemed gift (NIRC Secs. 98-100) taxed at 6% donor's tax (Sec. 99(A)), and is inurement (RMO 38-2019 IV.A.4)."
    class: author-interpretation
    source_path: https://lawphil.net (NIRC Secs. 98-100 as amended by TRAIN)
    source_locator: "research-ph-law.md Q7, caveat 7"
  - id: ph-pcnc
    text: "For PCNC-accredited donee institutions, any sale or lease to 'any corporation controlled directly or indirectly by' founders or trustees is a prohibited transaction regardless of price (RR 13-98 Sec. 10(d)); whether it covers IP licences is a question for counsel."
    class: author-interpretation
    source_path: https://www.pcnc.com.ph (BIR RR 13-98, PCNC-hosted copy)
    source_locator: "research-ph-law.md Q7, caveat 7, counsel question 6"
  - id: ph-public
    text: "Scientific research counts as public-interest when results are 'available to the public on a non-discriminatory basis' (RR 13-98 Sec. 1(g)(iii); RMO 38-2019 II.E.2.c), which exclusive licensing to a founder-owned company works against."
    class: author-interpretation
    source_path: https://www.pcnc.com.ph (BIR RR 13-98, PCNC-hosted copy)
    source_locator: "research-ph-law.md caveat 9"
  - id: ph-opportunity
    text: "Corporate-opportunity rules (RCC Sec. 30 para. 2; Sec. 33 applied to non-stock corporations via Sec. 86) make trustees account for profits from opportunities that belonged to the corporation."
    class: author-interpretation
    source_path: https://elibrary.judiciary.gov.ph (RA 11232 Secs. 30, 33, 86)
    source_locator: "research-ph-law.md Q5, caveat 6"
  - id: ph-held-in-trust
    text: "'A non-stock, non-profit corporation only holds its funds in trust for carrying out the objectives and purposes expressed in its charter'; members have no beneficial interest in its assets before dissolution (SEC opinion of 20 March 1995, quoted in SEC-OGC 22-14)."
    class: author-interpretation
    source_path: https://www.sec.gov.ph/wp-content/uploads/2022/10/2022OpinionNo22-14_Legalityofconvertinganon-stock_non-profittoastockcorporation.pdf
    source_locator: "research-ph-law.md Q1, caveat 2"
  - id: future-company
    text: "The draft's Separate Future Company Principle: a founder-owned company is a separate entity with no right to EM's assets; every dealing is a related-party transaction; open-licensed releases are available to it on the same public terms as to anyone (PROVISIONAL, GDR-023)."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§9, pp.26-27"
  - id: q-counsel
    text: "Open questions for counsel: tax treatment of dividends from a subsidiary to a Sec. 30(E) parent; how much licensing or service income is safe; whether founders who are organizers can be paid; whether RR 13-98 Sec. 10(d) bars all deals with a founder-controlled company; exact Articles and By-Laws wording."
    class: limitation
    source_path: sources/research-ph-law.md
    source_locator: "'Open questions for counsel' 1-3, 6, 11"

  # ------------------------------------------------------------------ expansion to ~15 min (2026-09-30)
  - id: ph-scientific
    text: "RMO 38-2019 II.E.2.c defines 'scientific purposes' by a list of fields (agriculture, forestry, fisheries, industry, engineering, energy development, food and nutrition, medicine, environment and biological, physical and natural sciences) 'for the public interest'; computer science and machine learning are not named. Whether ML research fits is unverified: counsel should advise on the purpose wording."
    class: limitation
    source_path: https://www.pcnc.com.ph/wp-content/uploads/2022/03/BIR-RMO-38-2019.pdf
    source_locator: "research-ph-law.md Q4 item 1"
  - id: removal-process
    text: "Member removal for cause (proposed): one of five listed causes; written notice with the facts; at least 30 days to respond in writing and at a hearing; a written finding by an independent reviewer; a vote of 2/3 of all members not counting the respondent (with three members, both of the other two); a written decision."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§7 'Ending membership' and 'Due process for removal', pp.21-22"
  - id: removal-not-cause
    text: "Not a cause for removal: scientific disagreement, disagreement about research direction, voting against the majority, publishing a result others dislike, or good-faith criticism."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "p.22"
  - id: removal-gap
    text: "The draft's own flag: RCC Sec. 27 lets 2/3 of members remove a trustee 'with or without cause', so two founders could remove the third from the Board (not from membership) with no cause; whether the By-Laws can require cause is legally uncertain and counsel should advise."
    class: author-interpretation
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§16 failure mode 6, p.46"
  - id: why-company
    text: "The founders' reason for considering a for-profit sister company: as grants grow the research becomes full-time work, and the founders doing it may need to earn from it, including profit. Stated by the owner on 2026-09-30; not in the draft."
    class: design
    source_path: owner instruction (2026-09-30)
    source_locator: "chat: 'when grants grow, we may need to also earn profit as founders doing active research'"
  - id: why-lab-pay
    text: "The draft allows the lab to pay researchers and employees for real work at reasonable, benchmarked rates; founders are subject to the Founder Transition Principle (§9)."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "Financial principles 7-8, p.32"
  - id: why-grants
    text: "Restricted grants are tracked separately and spent only on their stated purpose (proposed; usually a grant condition)."
    class: design
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "Financial principle 12, p.33"
  - id: why-company-fit
    text: "The draft anticipates that the founders may 'later create a Philippine stock corporation for commercial work', incorporated separately; a stock corporation may sell products and services and distribute profit to its owners, which the non-stock lab may not (RCC Sec. 86)."
    class: author-interpretation
    source_path: sources/governance-draft-v0.1.pdf
    source_locator: "§9 Separate Future Company Principle, p.26; RCC Sec. 86 in research-ph-law.md Q6"
  - id: oa-de-conditions
    text: "The Delaware AG's conditions (2025-10-28): the nonprofit has sole power to appoint and remove PBC directors; the PBC's mission is identical; the Safety and Security Committee stays at the nonprofit and can require mitigations 'up to and including halting the release of models'; within one year at least two nonprofit directors are not on the PBC board; the AG gets advance notice of significant governance changes."
    class: measured
    source_path: https://news.delaware.gov/2025/10/28/ag-jennings-completes-review-of-openai-recapitalization/
    source_locator: "research-openai.md § DE conditions"
  - id: oa-classn
    text: "Under the California AG MOU (2025-10-27), control of the PBC lasts 'so long as the NFP holds Class N Common Stock'; the nonprofit board alone appoints and removes PBC directors."
    class: measured
    source_path: https://oag.ca.gov/system/files/attachments/press-docs/Final%20Executed%20MOU%20Between%20OpenAI%20and%20California%20AG%20re%20Notice%20of%20Conditions%20of%20Non-Objection%20%2810.27.2025%29%20%28Signed%20by%20OpenAI%29%20%28Signed%20by%20CA%20DOJ%29.pdf
    source_locator: "MOU item 2; research-openai.md § CA MOU"
  - id: ph-articles-four
    text: "For a Sec. 30 exemption the Articles must expressly state: (i) non-stock, non-profit; (ii) no part of net income inures to any private individual; (iii) trustees receive no compensation; (iv) on dissolution, assets go to entities with similar purposes or to the government (RMO 38-2019 VI.A.2)."
    class: author-interpretation
    source_path: https://www.pcnc.com.ph/wp-content/uploads/2022/03/BIR-RMO-38-2019.pdf
    source_locator: "research-ph-law.md Q4 item 6"
  - id: ph-inurement-list
    text: "RMO 38-2019 IV.A lists six inurements, including 'payment of compensation, salaries, or honorarium to its trustees or organizers' and buying goods or services above fair market value 'from an entity in which one or more of its trustees, officers or fiduciaries have an interest'."
    class: author-interpretation
    source_path: https://www.pcnc.com.ph/wp-content/uploads/2022/03/BIR-RMO-38-2019.pdf
    source_locator: "research-ph-law.md Q4 item 5"
  - id: ph-organizers-pay
    text: "On the RMO's plain words, any salary to the founders (as organizers) is listed inurement, even as employee-researchers; RCC Sec. 29 bars trustee pay only 'in their capacity as such'. Open question for counsel."
    class: author-interpretation
    source_path: sources/research-ph-law.md
    source_locator: "Q4 item 5 note; caveat 8"
  - id: ph-ratify-weak
    text: "If the three founders are also the only members, a Sec. 31 ratification would be the founders ratifying their own deal: not forbidden, but it defeats the purpose; adding independent people means admitting them as members (RCC Sec. 91)."
    class: author-interpretation
    source_path: sources/research-ph-law.md
    source_locator: "Q5 'How these bite' item 3"
  - id: ph-substantially-all
    text: "A transfer of 'all or substantially all' assets needs at least 2/3 of the members (RCC Sec. 39); moving the core model, IP or compute into the for-profit could qualify (the research's inference)."
    class: author-interpretation
    source_path: https://lawphil.net (RA 11232 Sec. 39)
    source_locator: "research-ph-law.md Q5 item 6"
  - id: ph-rent
    text: "Rent earned by a Sec. 30 organisation is taxable regardless of how it is used (CIR v. CA, CTA and YMCA, 1998; RMO 38-2019 V)."
    class: author-interpretation
    source_path: https://lawphil.net/judjuris/juri1998/oct1998/gr_124043_1998.html
    source_locator: "research-ph-law.md Q3"
  - id: ph-royalty
    text: "Royalties earned as passive income by a Sec. 30 organisation carry a 20% final tax (RMO 38-2019 V.A.3; NIRC Sec. 27(D)(6) after CMEPA). Whether a given licence is passive royalty or business income is fact-dependent."
    class: author-interpretation
    source_path: https://www.pcnc.com.ph/wp-content/uploads/2022/03/BIR-RMO-38-2019.pdf
    source_locator: "research-ph-law.md Q3 table"
  - id: ph-business-income
    text: "Licence or service fees from an active business (e.g. selling model access) are income from an activity conducted for profit: taxable (St. Luke's 2012; RMO 38-2019 V), and the activity must stay incidental to the purpose (SEC-OGC 24-21)."
    class: author-interpretation
    source_path: https://lawphil.net/judjuris/juri2012/sep2012/gr_195909_2012.html
    source_locator: "research-ph-law.md Q3 table, Q2"
  - id: ph-dividends
    text: "Dividends from a Philippine subsidiary: NIRC Sec. 27(D)(3) exempts dividends received by 'a domestic corporation', which on the text includes a non-stock one; no BIR ruling, RMO or court decision was found applying it to a Sec. 30(E) parent. Uncertain."
    class: author-interpretation
    source_path: sources/research-ph-law.md
    source_locator: "Q3 'Intercorporate dividends'"
  - id: ph-reallocate
    text: "For organisations owned or controlled by the same interests, the Commissioner may allocate gross income or deductions between them to prevent tax evasion or clearly reflect income (NIRC Sec. 50)."
    class: author-interpretation
    source_path: https://lawphil.net (NIRC Sec. 50)
    source_locator: "research-ph-law.md Q7 item 6"
