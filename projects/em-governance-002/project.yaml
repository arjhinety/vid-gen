# Experimental Machines — governance film 2: the founders' decisions, the first outside trustee, and "the OpenAI move".
# ~15 minutes. Same house format and the same bean cast as em-governance-001 (scenes/shared/cast.tsx, copied so this
# project stands alone; Xynil added).
# Sources: sources/governance-draft-v0.1.pdf (every decision); sources/research-openai.md and research-ph-law.md
# (the company part: primary URLs quoted there); the owner's instruction for Xynil's role. Numbers: data/governance.json
# (data/extract.py) and data/web.json (data/extract_web.py). Claims: sources/claims.yaml. Not legal advice; the film says so.
id: em-governance-002
title: "Sixteen cards and a company"
description: >-
  The decisions only the founders can make under the governance draft v0.1 (the five that block the Articles, the other
  eleven, the review pass), how Xynil Jhed Lacap would join as the first outside trustee, and what "the OpenAI move"
  (a for-profit beside the non-profit) would mean, with its legal caveats in the Philippines.
format: { width: 1920, height: 1080, fps: 30 }
brand: { name: Experimental Machines, place: Philippines, crumbs: [Governance · decisions] }
headline: { enabled: false }
languages:
  en: { voice: narrator-en, subtitles: [en] }
script: script/narration.yaml
claims: sources/claims.yaml
audio:
  target_lufs: -16
  line_gap: 0.35
  beat_gap: 1.0
  music:
    path: projects/opengrad-study-001/assets/music/graph-paper-learning.wav
    gain_db: -9
    duck_db: -7
  sfx:
    - { at: "five-first:settled", offset: 0.9, sound: stamp, gain_db: -16 }
    - { at: "proposals:protects", offset: 0.3, sound: impact, gain_db: -13 }
    - { at: "here-three:no", offset: 0.1, sound: stamp, gain_db: -15 }
    - { at: "sister-traps:traps", offset: 0.2, sound: thump, gain_db: -16 }
