# Japanese narrator: Irodori-TTS v4.1-Small cloning its own frozen, caption-designed master clip.
# Master: ja-master-heroine (2026-09-28, after owner feedback that the pilot narration was "too monotone").
# Measured pitch variation (SD of F0 in semitones over the benchmark's JA passages):
#   clone of ja-master-soft (previous) 3.77, clone of ja-master-heroine 4.25 (10-90 % range 8.8 -> 11.1 st),
#   caption-only 4.95 but the voice drifts between sentences (ECAPA consistency 0.74 vs 0.91), so not usable.
# heroine is also the more anime-style master (median F0 ~351 Hz vs 254 Hz). Benchmark: kana CER 0.9 %,
# consistency 0.91, 4.6 GB reserved per sentence. ja-master-soft / ja-master-bright remain drop-in swaps.
id: narrator-ja
lang: ja
engine: irodori
description: Bright, clear young female narrator with an anime-style timbre (synthetic, caption-designed).
params:
  checkpoint: Aratako/Irodori-TTS-v4.1-Small
  ref_wav: research/tts/voices/ja-master-heroine.wav   # 19.0 s, -16 LUFS, 48 kHz; transcript + provenance in ja-master-heroine.yaml
  cache_ref_latent: true      # encode the reference once per process (RTF 0.84 -> 0.72 median)
  precision: bf16             # ~4.6-5.2 GB torch reserved at sentence level on the 6 GB RTX 4050
  num_steps: 40
  cfg_scale_text: 3.0
  cfg_scale_speaker: 5.0
  duration_scale: 1.0
  seed: 1234
# Direction: Irodori reads emoji in the text as delivery cues (its own palette, irodori_tts/gradio_emoji_palette.py).
# One emoji per clause barely moves pitch (SD 4.20 -> 4.27); two stacked at the start of the clause that carries the
# emotion widen it (SD 4.20 -> 5.44 st, 10-90 range 10.8 -> 12.6 st) and are not read as words (research/tts/
# emotion-tags.md §3.2). One test line stretched a vowel ("消えましたー!"); the CER gate ignores 「ー」.
# Untagged lines are bit-identical to the undirected voice. curious and warm are new (not in the test).
tone_via: inline
tones:
  curious: "🤔😊"      # 疑問 + 楽しげ
  disbelief: "😲😰"    # 驚き + 慌てる
  irony: "😏🙄"        # からかう + 呆れ
  gravity: "😟😖"      # 心配 + 苦しげ
  surprise: "😲😆"     # 驚き + 喜び
  reveal: "⏸️⏸️😎💥"   # 間 x2 + 得意げ + 勢いよく
  resolve: "💪😎"      # 力強く + 得意げ
  warm: "🫶😊"         # 優しく + 楽しげ
# Pipeline contract for this voice:
#  - one sentence per call, <= ~70 characters / well under Irodori's 30 s cap (a 30 s call spilled 2-3 GB
#    into shared GPU memory and hallucinated/truncated the passage);
#  - send the kana-normalised spoken form (Irodori has no number/Latin front-end; raw "VRAM", "BF16", "0.5B"
#    are read unpredictably);
#  - output carries Irodori's SilentCipher watermark (payload IRDTS).
provenance: >-
  Fully synthetic voice. ja-master-heroine.wav was generated by Irodori-TTS v4.1-Small (MIT + Ethical Restrictions)
  from the caption "明るく澄んだアニメ声の若い女性。知的で優しく、少し楽しげに、はっきりと丁寧に説明している。クリアな音質。"
  (seed 2026, bf16, 40 steps) with no reference audio; the caption names no person or character, and no recording of
  any real person or character was used. See research/tts/voices/ja-master-heroine.yaml (sha256, revision, metrics).
